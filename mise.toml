# Dev tools for this repo, pinned for reproducible hooks and checks.
[tools]
# Lints the GitHub Actions workflows (.github/workflows), shell snippets included (hk.pkl).
actionlint = "1.7.12"
# Bumps the version, commits, tags, and pushes for `just release` (release.toml, ADR-013).
cargo-release = "1.1.7"
# Checks dependencies against deny.toml: advisories, licenses, duplicates, sources (ADR-015).
cargo-deny = "0.20.2"
dprint = "0.64.3"
hk = "2.11.1"
just = "1.59.0"
# Lints the shell scripts in scripts/ (hk.pkl); actionlint also runs it on workflow `run:` steps.
shellcheck = "0.11.0"
# The C compiler of the static musl build (`just build-static`, scripts/zig-cc-musl).
zig = "0.17.1"

[settings]
# Rust comes from rust-toolchain.toml (channel, components, targets), so it isn't in [tools]: a
# `rust` pin here would install the toolchain without those components (docs/til.md).
idiomatic_version_file_enable_tools = ["rust"]
