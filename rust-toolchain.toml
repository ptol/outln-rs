# Pins the exact Rust toolchain; rustup installs it automatically on first use.
# Bump deliberately (and fix any new lints in the same change).
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
# The static build's target (`just build-static`). mise overrides this file (docs/til.md), so
# the recipe also adds the target itself.
targets = ["x86_64-unknown-linux-musl"]
profile = "minimal"
