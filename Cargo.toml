[package]
name = "outln"
version = "0.2.0"
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
# The published crate holds only what builds it; integration tests (`tests/`), casefiles, docs,
# and dev tooling stay in git (an allowlist, so new repo files stay out of the crate by default).
# `cargo package` warns that it ignores each integration test target for this reason; that is
# expected. The engine samples are the exception: unit tests in `src/language_engine/contract.rs`
# read them, so `cargo test` still passes on the published crate.
include = ["src/**/*.rs", "tests/engine-samples/*", "Cargo.toml", "Cargo.lock", "LICENSE"]
keywords = ["outline", "cli", "tree-sitter", "coding-agents", "markdown"]
license = "MIT"
# crates.io doesn't parse YAML frontmatter, so README.md's would render as a rule and a heading
# (ADR-010). The crate page links to the repository instead.
readme = false
repository = "https://github.com/ptol/outln-rs"
rust-version = "1.99"
description = "CLI for generating structural outlines of source files for coding agents."

[dependencies]
clap = { version = "4.6.7", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "string",
] }
globset = { version = "0.4.21", default-features = false }
ignore = "0.4.34"
pulldown-cmark = { version = "0.13.6", default-features = false }
tree-sitter = { version = "0.27.1", default-features = false }
tree-sitter-javascript = "0.25.0"
tree-sitter-json = { version = "0.24.8", default-features = false }
tree-sitter-rust = { version = "0.24.2", default-features = false }
tree-sitter-toml-ng = { version = "0.7.0", default-features = false }
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = { version = "0.7.2", default-features = false }

[lints.rust]
unsafe_code = "forbid"
# Keeps the public surface minimal: items that aren't reachable from the crate root must be pub(crate).
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Restriction lints: expected failures are values (Result/Option); panics are for bugs only.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Output goes through an injected writer (functional core, imperative shell).
print_stdout = "warn"
print_stderr = "warn"
# Matches over our own enums list every variant, so adding one forces a decision at each match.
wildcard_enum_match_arm = "warn"
# Lint exceptions are `#[expect(lint, reason = "...")]`: they need a reason and fail once obsolete.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
# Performance and a small single binary over build speed.
lto = "fat"
codegen-units = 1
strip = true
